spring.application.name=caterpillar-mining-platform
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/caterpillar?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_schema=caterpillar
spring.jpa.hibernate.naming.physical-strategy=com.caterpillar.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
